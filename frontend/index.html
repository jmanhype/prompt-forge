<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Forge v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #888;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        select:focus {
            outline: none;
            border-color: #00ff00;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .range-value {
            min-width: 3rem;
            color: #00ff00;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #00ff00;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .result {
            margin-top: 2rem;
            display: none;
        }

        .result.active {
            display: block;
        }

        .image-container {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .metadata {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .metadata-label {
            color: #888;
        }

        .metadata-value {
            color: #00ff00;
        }

        .json-prompt {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 1rem;
            font-size: 0.85rem;
            color: #00ff00;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error {
            background: #1a1a1a;
            border: 1px solid #ff0000;
            padding: 1rem;
            color: #ff0000;
            margin-top: 1rem;
            display: none;
        }

        .error.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #888;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PROMPT FORGE v2</h1>

        <div class="form-group">
            <label for="description">DESCRIBE WHAT YOU WANT TO SEE</label>
            <textarea id="description" placeholder="Godzilla destroying Tokyo at sunset, 1960s military footage..."></textarea>
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="lora">LoRA</label>
                <select id="lora">
                    <option value="ektachrome_style_v1.safetensors">Ektachrome v1</option>
                </select>
            </div>

            <div class="form-group">
                <label for="strength">Strength</label>
                <div class="range-container">
                    <input type="range" id="strength" min="0.1" max="1.0" step="0.1" value="0.8">
                    <span class="range-value" id="strength-value">0.8</span>
                </div>
            </div>
        </div>

        <button id="generate-btn">GENERATE</button>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            <span>Generating image...</span>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="image-container">
                <img id="result-image" src="" alt="Generated image">
            </div>

            <div class="metadata" id="metadata"></div>

            <details>
                <summary style="cursor: pointer; color: #888; margin-bottom: 0.5rem;">JSON PROMPT</summary>
                <div class="json-prompt" id="json-prompt"></div>
            </details>
        </div>
    </div>

    <script>
        const descriptionEl = document.getElementById('description');
        const loraEl = document.getElementById('lora');
        const strengthEl = document.getElementById('strength');
        const strengthValueEl = document.getElementById('strength-value');
        const generateBtn = document.getElementById('generate-btn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');
        const resultImageEl = document.getElementById('result-image');
        const metadataEl = document.getElementById('metadata');
        const jsonPromptEl = document.getElementById('json-prompt');

        // Update strength display
        strengthEl.addEventListener('input', () => {
            strengthValueEl.textContent = strengthEl.value;
        });

        // Generate button handler
        generateBtn.addEventListener('click', async () => {
            const description = descriptionEl.value.trim();
            if (!description) {
                showError('Please enter a description');
                return;
            }

            const lora = loraEl.value;
            const strength = parseFloat(strengthEl.value);

            // Reset UI
            hideError();
            hideResult();
            showLoading();
            generateBtn.disabled = true;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        description,
                        lora,
                        lora_strength: strength
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Generation failed');
                }

                const data = await response.json();
                showResult(data);
            } catch (err) {
                showError(err.message);
            } finally {
                hideLoading();
                generateBtn.disabled = false;
            }
        });

        function showLoading() {
            loadingEl.classList.add('active');
        }

        function hideLoading() {
            loadingEl.classList.remove('active');
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        function hideError() {
            errorEl.classList.remove('active');
        }

        function showResult(data) {
            resultImageEl.src = `/outputs/${data.session_id}.png`;
            
            const duration = (data.duration_ms / 1000).toFixed(1);
            metadataEl.innerHTML = `
                <div class="metadata-item">
                    <span class="metadata-label">Session ID:</span>
                    <span class="metadata-value">${data.session_id}</span>
                </div>
                <div class="metadata-item">
                    <span class="metadata-label">Duration:</span>
                    <span class="metadata-value">${duration}s</span>
                </div>
                <div class="metadata-item">
                    <span class="metadata-label">Size:</span>
                    <span class="metadata-value">1024×768</span>
                </div>
            `;

            jsonPromptEl.textContent = JSON.stringify(data.json_prompt, null, 2);
            
            resultEl.classList.add('active');
        }

        function hideResult() {
            resultEl.classList.remove('active');
        }

        // Allow Ctrl+Enter to generate
        descriptionEl.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                generateBtn.click();
            }
        });
    </script>
</body>
</html>
